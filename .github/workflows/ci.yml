name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's cache from the newest earlier run, so packages a commit did not touch skip
      # typecheck, test and build. Every file a task reads must be in its turbo.json inputs,
      # or a hit would hide a change. Entries older than a week are dropped before saving.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-
      - run: pnpm verify
      - run: find .turbo/cache -type f -mtime +6 -delete

  do-lifecycle:
    # Durable Object migrations must ship alone, in a PR labelled do-lifecycle. Skipped only
    # for this repository's develop -> main PR, which carries whatever develop holds (ADR
    # 0036); a fork can name a branch develop, hence the repository test.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.base_ref == 'main' && github.head_ref == 'develop' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx tools/ci/check-do-lifecycle.ts "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          DO_LIFECYCLE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'do-lifecycle') }}

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            # Bot commits (release-please, Renovate, Claude) are made by automation
            # the maintainers configured, not by contributors certifying the DCO.
            case "$(git show -s --format=%ae "$c")" in
              *"[bot]@users.noreply.github.com") continue ;;
            esac
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c has no DCO sign-off; use git commit -s (see CONTRIBUTING.md)"
              fail=1
            fi
          done
          exit $fail

  secrets:
    # gitleaks-action reads PR commits through the API and does not support merge queues.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
