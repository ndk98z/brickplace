packages:
  - apps/*
  - workers/*
  - packages/*
  - tools/ci
  - tools/sim
  - tools/bots

# Refuse packages published less than a day ago (supply-chain hygiene).
minimumReleaseAge: 1440

# Older session worktrees symlinked node_modules from the main tree, which pnpm's pre-run
# dependency check reads as stale and tries to purge. CI installs with --frozen-lockfile, so
# the check adds nothing there.
verifyDepsBeforeRun: false

catalog:
  "@biomejs/biome": ^2.6.0
  "@cloudflare/vitest-plugin": ^1.4.0
  "@types/node": ^24.0.0
  tsx: ^4.23.0
  turbo: ^2.11.0
  typescript: ^7.0.0
  vite: ^8.3.0
  vitest: ^5.0.0
  wrangler: ^4.140.0

# Security floors for tool dependencies whose upstream still pins a vulnerable version
# (wrangler and miniflare pin undici 7.29; @cloudflare/vitest-plugin and wrangler pin zod
# 4.6.5). Dev and test tooling only: nothing here ships in a Worker bundle. Drop an entry
# once `pnpm audit` stays clean without it.
overrides:
  "undici@>=7.0.0 <7.30.1": ^7.30.2 # GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx and others
  "zod@>=4.0.0 <4.6.6": ^4.6.7 # GHSA-mrhx-c7xc-m3w5

# Packages allowed to run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true
